# Default RuboCop configuration for plain Ruby projects at UB Paderborn.
# Rails projects use rails.yml, which builds on this file.
#
# All cops use RuboCop's defaults unless configured below.

plugins:
  - rubocop-performance
  - rubocop-minitest

inherit_mode:
  merge:
    - Exclude

AllCops:
  # New cops are enabled when RuboCop is upgraded. Projects control upgrades
  # through their Gemfile.lock.
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - "data/**/*"
    - "log/**/*"
    - "node_modules/**/*"
    - "tmp/**/*"

# ----------------------------------------------------
# Layout cops
# ----------------------------------------------------

# Allow empty lines around the body of a class except for the namespace.
Layout/EmptyLinesAroundClassBody:
  EnforcedStyle: empty_lines_except_namespace

# Allow empty lines around the body of a module except for the namespace.
Layout/EmptyLinesAroundModuleBody:
  EnforcedStyle: empty_lines_except_namespace

# Align `end` with the matching keyword or starting expression except for
# assignments, where it should be aligned with the LHS.
Layout/EndAlignment:
  EnforcedStyleAlignWith: variable
  AutoCorrect: true

# Use `{a: 1}` not `{ a:1 }`.
# Use `{}` not `{  }`.
Layout/SpaceInsideHashLiteralBraces:
  EnforcedStyle: no_space
  EnforcedStyleForEmptyBraces: no_space

# ----------------------------------------------------
# Metrics cops
# ----------------------------------------------------

Metrics:
  Enabled: false

# ----------------------------------------------------
# Style cops
# ----------------------------------------------------

# We generally prefer &&/|| but like low-precedence and/or in context
Style/AndOr:
  Enabled: false

# Do not enforce documentation comments
Style/Documentation:
  Enabled: false

# Do not check for frozen string literals comment
Style/FrozenStringLiteralComment:
  Enabled: false

# Use Ruby >= 1.9 syntax for hashes but not mixed keys.
# Allow shorthand syntax but don't enforce it.
Style/HashSyntax:
  EnforcedStyle: ruby19_no_mixed_keys
  EnforcedShorthandSyntax: either

Style/PercentLiteralDelimiters:
  PreferredDelimiters:
    default: "()"
    "%i": "[]"
    "%I": "[]"
    "%r": "{}"
    "%w": "[]"
    "%W": "[]"

Style/RedundantReturn:
  AllowMultipleReturnValues: true

# Allow ; to separate several expressions on the same line
Style/Semicolon:
  AllowAsExpressionSeparator: true

# Use `"foo"` not `'foo'` unless escaping is required, also inside
# interpolation.
Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes

# Use brackets for symbol and word arrays
Style/SymbolArray:
  EnforcedStyle: brackets

Style/WordArray:
  EnforcedStyle: brackets

# ----------------------------------------------------
# Performance cops
# ----------------------------------------------------

Performance:
  Exclude:
    - "test/**/*"
